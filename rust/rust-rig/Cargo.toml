[package]
name = "rust-rig"
version = "0.1.0"
edition = "2024"

[dependencies]
rig-core = "0.39.0"
rig-llama-cpp = "0.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]

[[example]]
name = "agent-as-tool"
path = "examples/agent_as_tool.rs"
